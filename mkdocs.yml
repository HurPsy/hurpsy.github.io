site_name: HurPsy
site_description: A family of three apps for designing and running computerized psychology experiments without writing code.
site_url: https://hurpsy.github.io/
copyright: HurPsy, by Hürol Aslan

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path: includes
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Status and directions: status.md
  - Tutorials:
      - "1. Introduction with a test experiment": tutorial-1-introduction.md
      - "2. Adding stimuli": tutorial-2-adding-stimuli.md
      - "3. Adding locators": tutorial-3-adding-locators.md
      - "4. Building the experiment pattern - Part 1": tutorial-4-experiment-pattern-1.md
      - "5. Building the experiment pattern - Part 2": tutorial-5-experiment-pattern-2.md
